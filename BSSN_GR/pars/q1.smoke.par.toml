BSSN_BH1 = { MASS = 0.4824, X = 3.0, Y = 0.0, Z = 0.0, V_X = 0.001, V_Y = 0.118, V_Z = 0.0, SPIN = 0.0, SPIN_THETA = 0.0, SPIN_PHI = 0.0 }

BSSN_BH2_AMR_R = 1.0
