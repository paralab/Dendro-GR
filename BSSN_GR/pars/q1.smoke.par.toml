## TPID SPECIFIC PARAMETERS
TPID_GIVE_BARE_MASS = 1
TPID_TARGET_M_PLUS = 0.4824
TPID_TARGET_M_MINUS = 0.4824
TPID_PAR_B = 4.0
INITIAL_LAPSE = 2
